```yaml
name: Deploy Backend Team Project

on:
  push:
    branches:
      - main

jobs:
  deploy-backend-to-target-environment:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Cache npm packages
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Login to Docker Hub
      uses: docker/login-action@v2.0.1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-label@v3
      with:
        context: .
        file: dist/Dockerfile
        tags: 'your-docker-hub-username/your-repo-name:latest'

    - name: Deploy to target environment
      env:
        TARGET_ENVIRONMENT_URL: ${{ secrets.TARGET_ENVIRONMENT_URL }}
        TARGET_ENVIRONMENT_TOKEN: ${{ secrets.TARGET_ENVIRONMENT_TOKEN }}
      run: |
        echo "TARGET_ENVIRONMENT_URL=${TARGET_ENVIRONMENT_URL} TARGET_ENVIRONMENT_TOKEN=${TARGET_ENVIRONMENT_TOKEN}" > config.env
        npm run deploy --config dist/deploy.json

```

Please replace `your-docker-hub-username` and `your-repo-name` with your actual Docker Hub username and repository name. Additionally, update the environment variables `TARGET_ENVIRONMENT_URL` and `TARGET_ENVIRONMENT_TOKEN` to match your target environment's URL and authentication token.