name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '14'
    - name: Install dependencies
      run: npm install
    - name: Lint code
      run: npm run lint
    - name: Build project
      run: npm run build
    - name: Test project
      run: npm test
    - name: Dockerize application
      uses: docker://node:latest
      with:
        args: 'build --tag myapp:latest'