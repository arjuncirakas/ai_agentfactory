version: '3.9'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - app-network

  api:
    image: node:latest
    working_dir: /usr/src/app
    command: npm install && npm run start
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/pharmacy_db
    ports:
      - "3001:3000"
    networks:
      - app-network

  react-client:
    image: node:latest
    working_dir: /usr/src/app
    command: npm install && npm run start
    depends_on:
      - api
    environment:
      REACT_APP_API_URL: http://api:3001/api
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network: